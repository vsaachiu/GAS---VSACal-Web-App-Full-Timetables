<style>
:root {
  --bg: #0f172a;
  --panel: #111827;
  --text: #e5e7eb;
  --muted: #9ca3af;
  --primary: #3b82f6;
  --success: #10b981;
  --danger: #ef4444;
  --border: #1f2937;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; }

.container { max-width: 1000px; margin: 0 auto; padding: 24px; }
header h1 { margin: 0; font-size: 28px; }
header h2 { margin: 6px 0 20px; font-weight: 400; color: var(--muted); }

.tabs { display: flex; gap: 8px; margin-bottom: 16px; }
.tab-btn { background: var(--panel); border: 1px solid var(--border); color: var(--text); padding: 10px 14px; border-radius: 8px; cursor: pointer; }
.tab-btn.active { background: var(--primary); border-color: var(--primary); }

.tab-content { display: none; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; }
.tab-content.active { display: block; }

/* Small instructional text shown at the top of each section */
.section-instructions { color: var(--muted); font-size: 13px; margin-bottom: 12px; line-height: 1.4; }

/* Make the header labels look clickable for sorting */
.form-row.header label { cursor: pointer; user-select: none; display: inline-flex; align-items: center; gap: 6px; }
.form-row.header label .sort-ind { font-size: 12px; color: var(--muted); }

.form-rows { display: grid; gap: 8px; }
.form-row { display: grid; grid-template-columns: 140px 1fr 1.4fr 1fr auto; gap: 8px; }
.form-row.header { color: var(--muted); font-size: 12px; }
.form-row select, .form-row input { width: 100%; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b1220; color: var(--text); }
.row-actions { display: flex; justify-content: flex-end; }

.controls { margin-top: 12px; display: flex; gap: 10px; align-items: center; }
.btn { background: #0b1220; color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; cursor: pointer; }
.btn.primary { background: var(--primary); border-color: var(--primary); }
.btn.success { background: var(--success); border-color: var(--success); }
.btn.danger { background: var(--danger); border-color: var(--danger); }
.btn.mini { padding: 6px 10px; font-size: 12px; }
.btn.icon { width: 44px; }

.preview-meta { margin: 6px 0 12px; color: var(--muted); }

.collapsible-list details { border: 1px solid var(--border); border-radius: 8px; margin: 10px 0; background: #0b1220; }
.collapsible-list summary { cursor: pointer; list-style: none; padding: 10px 12px; font-weight: 600; }
.collapsible-list .event-list { list-style: none; margin: 0; padding: 10px 12px 12px; display: grid; gap: 10px; }
.event-item { display: grid; grid-template-columns: 1fr 0.9fr auto; gap: 10px; align-items: center; }
.event-time-edit { display: flex; gap: 8px; align-items: center; }
.event-time { color: var(--muted); font-size: 14px; }
.event-title-edit { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f1525; color: var(--text); width: 100%; }

/* Make date/time inputs in preview match site styling */
.event-time-edit input[type="date"], .event-time-edit input[type="time"] {
  padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0f1525; color: var(--text);
}
.event-time-edit .time-sep { color: var(--muted); padding: 0 8px; }

/* Preview-specific delete button: use a ghost/danger style so it matches the site
   (filled red buttons are reserved for destructive confirmations elsewhere). */
.event-item .btn.danger {
  background: transparent;
  color: var(--danger);
  border-color: rgba(239,68,68,0.12);
}
.event-item .btn.danger:hover { background: rgba(239,68,68,0.06); }

/* Disabled button appearance used across the UI */
.btn[disabled], .btn.disabled {
  opacity: 0.5;
  cursor: not-allowed;
  pointer-events: none;
  filter: grayscale(20%);
}

.event-item .btn.danger.disabled {
  background: transparent;
  color: rgba(239,68,68,0.6);
  border-color: rgba(239,68,68,0.06);
}

.calendar-picker { margin: 10px 0; display: flex; gap: 8px; align-items: center; }
.calendar-picker select, .calendar-picker input { padding: 8px 10px; border-radius: 8px; border: 1px solid var(--border); background: #0b1220; color: var(--text); }
/* Limit calendar select width so it doesn't stretch the layout */
.calendar-picker select { max-width: 360px; min-width: 220px; }

.spinner-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.4); display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; z-index: 9999; }
.spinner { width: 36px; height: 36px; border: 3px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; }
.spinner-text { color: var(--muted); }

@keyframes spin { to { transform: rotate(360deg); } }

/* Modal styles matching site dark theme */
.schoogle-modal-overlay {
  position: fixed; left: 0; top: 0; right: 0; bottom: 0;
  background: rgba(2,6,23,0.6); display: flex; align-items: flex-start; justify-content: center; padding-top: 48px; z-index: 9999;
}
.schoogle-modal-box {
  background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 10px; padding: 16px; max-width: 720px; width: calc(100% - 48px); max-height: 70vh; overflow: auto;
}
.schoogle-modal-box h3 { margin-top: 0; }
.schoogle-modal-box .btn { margin-left: 8px; }

/* Active Jobs Styles */
.jobs-section { margin-bottom: 24px; }
.jobs-section h3 { margin: 0 0 12px 0; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.count-badge { background: var(--border); color: var(--muted); font-size: 12px; padding: 2px 8px; border-radius: 12px; font-weight: normal; }
.jobs-list { border: 1px solid var(--border); border-radius: 8px; background: #0b1220; }
.no-jobs { padding: 16px; color: var(--muted); text-align: center; font-style: italic; }
.job-item { padding: 12px 16px; border-bottom: 1px solid var(--border); }
.job-item:last-child { border-bottom: none; }
.job-title { font-weight: 600; color: var(--text); margin-bottom: 4px; }
.job-details { color: var(--muted); font-size: 13px; display: flex; flex-wrap: wrap; gap: 16px; }
.job-meta { display: flex; align-items: center; gap: 4px; }
.collapsible-header { cursor: pointer; user-select: none; }
.toggle-icon { margin-left: auto; font-size: 12px; transition: transform 0.2s; }
.toggle-icon.collapsed { transform: rotate(-90deg); }
#openSchoogleBtn { margin-left: 8px; display: none; }
#completedJobsList { display: none; }
.calendar-link { background: var(--primary); border-color: var(--primary); color: white; padding: 4px 8px; font-size: 14px; }
.notification-count { display: none; background: #ef4444; color: white; border-radius: 12px; padding: 2px 6px; font-size: 12px; font-weight: bold; margin-left: 6px; min-width: 16px; text-align: center; }

</style>
